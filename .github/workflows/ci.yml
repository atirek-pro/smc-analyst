name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff) + skill checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff (pinned)
        run: python -m pip install --disable-pip-version-check "ruff==0.17.3"
      - name: Ruff
        run: python -m ruff check --output-format=github .
      - name: Validate manifests and SKILL.md frontmatter
        run: |
          python - <<'PY'
          import json, pathlib, re, sys
          root = pathlib.Path(".")
          plugin = json.loads((root / ".claude-plugin/plugin.json").read_text())
          market = json.loads((root / ".claude-plugin/marketplace.json").read_text())
          assert plugin["name"] in {p["name"] for p in market["plugins"]}, "marketplace entry != plugin name"
          skill = (root / "skills/smc-analyst/SKILL.md").read_text(encoding="utf-8")
          fm = re.match(r"^---\n(.*?)\n---\n", skill, re.S)
          assert fm and "name: smc-analyst" in fm.group(1) and "description:" in fm.group(1), "bad frontmatter"
          assert len(skill.splitlines()) < 300, "SKILL.md exceeds the 300-line budget"
          print("manifests + SKILL.md OK, version", plugin["version"])
          PY
      - name: JavaScript syntax
        run: |
          node --check skills/smc-analyst/assets/dashboard/app.js
          node --check skills/smc-analyst/assets/dashboard/overlays.js
          node --check skills/smc-analyst/assets/dashboard/navigation.js

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            skills/smc-analyst/scripts/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Test (offline; deprecations are errors)
        run: python -m pytest -W error::FutureWarning -W error::DeprecationWarning
      - name: setup.py smoke test (creates the skill's own venv)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python skills/smc-analyst/scripts/setup.py --json --quiet
          python skills/smc-analyst/scripts/setup.py --check --json
